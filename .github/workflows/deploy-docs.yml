name: Deploy Docs

# The docs app builds dist/ itself, so a change to the framework or to the docs
# is deployed straight from main. The Release workflow calls this one with the
# new tag.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "vendor/**"
      - "fonts/**"
      - "flags/**"
      - "scripts/build*.ts"
      - "site/**"
      - "package.json"
      - "bun.lock"
  workflow_call:
    inputs:
      ref:
        description: Tag or commit to deploy
        type: string
        required: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install the framework dependencies
        run: bun install --frozen-lockfile
      - name: Install the docs app dependencies
        run: bun install --frozen-lockfile
        working-directory: site
      # Builds dist/ (root), copies it into public/, runs next build and the
      # OpenNext build, then wrangler deploy.
      - name: Build and deploy to Cloudflare Workers
        run: bun run deploy
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
