name: Build dist

# dist/ is committed, so jsDelivr can serve it from a tag:
# https://cdn.jsdelivr.net/gh/Djirasak/tsunami-framework@<tag>/dist/tsunami.min.css
# Every push to main that changes the source rebuilds dist/ and commits the
# result. A commit made with the workflow's token starts no other workflow.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "vendor/**"
      - "fonts/**"
      - "flags/**"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-dist
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Commit dist
        run: |
          git add dist
          if git diff --cached --quiet; then
            echo "dist is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build dist"
          git pull --rebase origin main
          git push origin HEAD:main
