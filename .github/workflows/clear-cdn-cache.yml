name: Clear CDN Cache

# jsDelivr reads a GitHub tag the first time a file is asked for. Now and then
# that first read fails ("Failed to fetch version info") and jsDelivr keeps the
# 404 for ten minutes, so a page that asks for dozens of files at once (the code
# editor) can break for its first visitors. After a release (the Release
# workflow calls this one with the new tag) it purges
# every file in dist/ one at a time, asks for it, and when the answer is an
# error purges and asks again, so the cache holds good answers before anyone
# loads the page.

on:
  workflow_call:
    inputs:
      tag:
        description: Tag to clear, for example v0.1.2
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to clear, for example v0.1.2
        required: true

permissions:
  contents: read

jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Purge, then ask jsDelivr for every file in dist/
        env:
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          base="${REPO}@${TAG}"
          files=$(git ls-files dist)
          total=$(echo "$files" | wc -l)
          echo "Clearing $total files of $base"
          echo
          n=0; failed=0; retried=0
          for file in $files; do
            n=$((n + 1))
            ok=0
            for attempt in 1 2 3 4 5 6 7 8; do
              purge=$(curl -s "https://purge.jsdelivr.net/gh/${base}/${file}" | jq -r '"purge " + (.status // "?")' 2>/dev/null || echo "purge ?")
              code=$(curl -s -o /dev/null -w '%{http_code}' "https://cdn.jsdelivr.net/gh/${base}/${file}")
              if [ "$code" = 200 ]; then ok=1; break; fi
              echo "  ... ${file}: HTTP ${code} (${purge}), try ${attempt} of 8"
              sleep 10
            done
            if [ "$ok" = 1 ]; then
              [ "$attempt" -gt 1 ] && retried=$((retried + 1))
              printf '✓ %3d/%d  %s  (try %d)\n' "$n" "$total" "$file" "$attempt"
            else
              printf '✗ %3d/%d  %s  HTTP %s\n' "$n" "$total" "$file" "$code"
              echo "::error::${file} still answers HTTP ${code} after 8 tries"
              failed=$((failed + 1))
            fi
          done
          echo
          echo "$((total - failed)) of $total files answer 200 ($retried needed a retry, $failed failed)"
          {
            echo "### Clear CDN Cache for \`${TAG}\`"
            echo
            echo "- ${total} files in dist/"
            echo "- $((total - failed)) answer 200, ${retried} needed a retry"
            echo "- ${failed} failed"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$failed" = 0 ]
