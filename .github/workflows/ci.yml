name: CI

# Every push to main and every pull request: the fast checks, then the browser
# tests in Chromium, Firefox and WebKit, then the accessibility scan.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Unit tests
        run: bun run test
      - name: Docs content
        run: bun run check:docs
      - name: TypeScript declarations
        run: bun run check:types
      - name: Build
        run: bun run build
      - name: Bundle size
        run: bun run size
      # High and critical advisories fail the build. A moderate one in a dev tool
      # (today: minimatch inside eslint) is shown by `bun audit` but does not block.
      - name: Dependency audit
        run: bun audit --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    env:
      E2E_BROWSERS: all
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install the framework dependencies
        run: bun install --frozen-lockfile
      - name: Install the browsers
        run: bunx playwright install --with-deps chromium firefox webkit
      # Playwright starts the docs itself (bun run docs) and waits for it.
      - name: Browser tests
        run: bun run test:e2e
      - name: Accessibility scan
        run: bun run check:a11y
      - name: Keep the report when a test fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
