name: CI

# Every push to main and every pull request: the fast checks, then the browser
# tests in Chromium, Firefox and WebKit (one job each, side by side) and the
# accessibility scan, all at the same time.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the changelog check compares with the last release tag
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Unit tests
        run: bun run test
      - name: Changelog
        run: bun run check:changelog
      - name: Docs content
        run: bun run check:docs
      - name: TypeScript declarations
        run: bun run check:types
      - name: Build
        run: bun run build
      - name: Bundle size
        run: bun run size
        env:
          REPORT_DIR: reports
      - name: Keep the report for the run summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-check
          path: reports/
          if-no-files-found: ignore
          retention-days: 1
      # High and critical advisories fail the build. A moderate one in a dev tool
      # (today: minimatch inside eslint) is shown by `bun audit` but does not block.
      - name: Dependency audit
        run: bun audit --audit-level=high

  e2e:
    runs-on: ubuntu-26.04
    needs: check
    timeout-minutes: 30
    strategy:
      fail-fast: false # a Firefox failure should not hide how WebKit did
      matrix:
        browser: [chromium, firefox, webkit]
    name: e2e (${{ matrix.browser }})
    env:
      E2E_BROWSERS: all
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install the framework dependencies
        run: bun install --frozen-lockfile
      # The browsers are kept between runs; the key changes with the lockfile, so
      # a new Playwright downloads its own. The system libraries install each time.
      - name: Cache the browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.browser }}-${{ hashFiles('bun.lock') }}
      - name: Install the browser
        run: bunx playwright install --with-deps ${{ matrix.browser }}
      - name: Start the docs
        run: |
          nohup bun run docs > docs.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://localhost:5477/docs > /dev/null && exit 0
            sleep 2
          done
          cat docs.log
          exit 1
      - name: Browser tests
        run: bun run test:e2e --project=${{ matrix.browser }}
      - name: Name the report after the browser
        if: ${{ !cancelled() }}
        run: |
          mkdir -p reports
          if [ -f playwright-report/results.json ]; then cp playwright-report/results.json reports/e2e-${{ matrix.browser }}.json; fi
      - name: Keep the report for the run summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-e2e-${{ matrix.browser }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 1
      - name: Keep the report when a test fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces-${{ matrix.browser }}
          path: |
            test-results/
            docs.log
          retention-days: 7

  a11y:
    runs-on: ubuntu-26.04
    needs: check
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install the framework dependencies
        run: bun install --frozen-lockfile
      # The browsers are kept between runs; the key changes with the lockfile, so
      # a new Playwright downloads its own. The system libraries install each time.
      - name: Cache the browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('bun.lock') }}
      - name: Install the browser
        run: bunx playwright install --with-deps chromium
      - name: Start the docs
        run: |
          nohup bun run docs > docs.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://localhost:5477/docs > /dev/null && exit 0
            sleep 2
          done
          cat docs.log
          exit 1
      - name: Accessibility scan
        run: bun run check:a11y
        env:
          REPORT_DIR: reports
      - name: Keep the report for the run summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-a11y
          path: reports/
          if-no-files-found: ignore
          retention-days: 1
      - name: Keep the docs log when the scan fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a11y-docs-log
          path: docs.log
          retention-days: 7

  # One table for the whole run, from the reports the jobs left. It runs even when
  # a job failed, and only fails itself if it cannot run.
  summary:
    runs-on: ubuntu-26.04
    needs: [check, e2e, a11y]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      pull-requests: write # the summary comment on the pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Gather the reports
        continue-on-error: true # nothing to gather when the check job failed first
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: report-*
          merge-multiple: true
          path: reports
      - name: Summary
        run: bun scripts/ci-summary.ts reports
        env:
          CHECK: ${{ needs.check.result }}
          E2E: ${{ needs.e2e.result }}
          A11Y: ${{ needs.a11y.result }}
      # The same summary as a comment on the pull request, one comment per pull
      # request that each run updates. A pull request from a fork gets a read-only
      # token, so it has the summary on the run page only.
      - name: Comment on the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.event.pull_request.head.sha }}
          CHECK: ${{ needs.check.result }}
          E2E: ${{ needs.e2e.result }}
          A11Y: ${{ needs.a11y.result }}
        run: |
          marker="<!-- ci-summary -->"
          {
            echo "$marker"
            GITHUB_STEP_SUMMARY= bun scripts/ci-summary.ts reports
            echo "[CI run]($RUN) for ${SHA:0:7}"
          } > comment.md
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | tail -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -F body=@comment.md > /dev/null
          fi
